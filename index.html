<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi viaje</title>
  <meta name="description" content="Asistente de viaje offline: itinerario, mapa, documentos, fotos y gastos compartidos.">
  <meta name="theme-color" content="#0b6e7f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/fontawesome.min.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/solid.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="top"><a href="#/inicio" id="brand">Mi viaje</a><span class="top-right"><span id="net" class="net-pill" hidden>sin conexión</span><button class="top-sim" data-act="sim-open" aria-label="Simular un día" title="Simular un día"><i class="fa-solid fa-flask" aria-hidden="true"></i></button><a href="#/buscar" class="top-search" aria-label="Buscar"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></a></span><div id="sim-bar" hidden></div></header>
  <main id="app"><p class="muted center loading">Cargando…</p></main>
  <nav id="nav" aria-label="Secciones">
    <a href="#/inicio" data-nav="inicio"><span><i class="fa-solid fa-house" aria-hidden="true"></i></span>Inicio</a>
    <a href="#/dia/d01" data-nav="dia"><span><i class="fa-solid fa-calendar-day" aria-hidden="true"></i></span>Día</a>
    <a href="#/mapa" data-nav="mapa"><span><i class="fa-solid fa-map" aria-hidden="true"></i></span>Mapa</a>
    <a href="#/gastos" data-nav="gastos"><span><i class="fa-solid fa-money-bill-wave" aria-hidden="true"></i></span>Gastos</a>
    <a href="#/mas" data-nav="mas"><span><i class="fa-solid fa-bars" aria-hidden="true"></i></span>Más</a>
  </nav>
  <noscript>Esta app necesita JavaScript.</noscript>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/main.js"></script>
  <script>
    (function () {
      var p = document.getElementById('net');
      function u() { p.hidden = navigator.onLine; }
      addEventListener('online', u); addEventListener('offline', u); u();
    })();
  </script>
</body>
</html>
